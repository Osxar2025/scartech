  <main class="wrap audiovisual-wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span>Tu biblioteca multimedia</div>
      <h1>Audiovisuales</h1>
      <p class="sub">Organiza y gestiona tu colección de música, imágenes y videos en un solo lugar.</p>
    </header>

    <!-- Upload Panel -->
    <section class="panel upload-panel">
      <div class="rivet tl"></div><div class="rivet tr"></div><div class="rivet bl"></div><div class="rivet br"></div>
      
      <div class="upload-tabs">
        <button class="upload-tab-btn active" data-type="music">🎵 Música</button>
        <button class="upload-tab-btn" data-type="image">🖼️ Imágenes</button>
        <button class="upload-tab-btn" data-type="video">🎬 Videos</button>
      </div>

      <!-- Música -->
      <div class="upload-section active" id="music-section">
        <label class="upload-label">
          <div class="upload-icon">♪</div>
          <div class="upload-text">
            <div class="upload-title">Sube una pista de música</div>
            <div class="upload-hint">MP3, WAV, FLAC (máx. 50MB)</div>
          </div>
          <input type="file" id="musicInput" accept="audio/*" style="display:none;">
        </label>
        <div class="upload-field-group">
          <input type="text" id="musicTitle" placeholder="Título de la pista" class="upload-field">
          <input type="text" id="musicArtist" placeholder="Artista" class="upload-field">
          <button type="button" class="upload-btn" id="addMusicBtn">Agregar pista</button>
        </div>
      </div>

      <!-- Imágenes -->
      <div class="upload-section" id="image-section">
        <label class="upload-label">
          <div class="upload-icon">🖼️</div>
          <div class="upload-text">
            <div class="upload-title">Sube una imagen</div>
            <div class="upload-hint">JPG, PNG, GIF (máx. 10MB)</div>
          </div>
          <input type="file" id="imageInput" accept="image/*" style="display:none;">
        </label>
        <div class="upload-field-group">
          <input type="text" id="imageTitle" placeholder="Título de la imagen" class="upload-field">
          <input type="text" id="imageDescription" placeholder="Descripción" class="upload-field">
          <button type="button" class="upload-btn" id="addImageBtn">Agregar imagen</button>
        </div>
      </div>

      <!-- Videos -->
      <div class="upload-section" id="video-section">
        <label class="upload-label">
          <div class="upload-icon">🎬</div>
          <div class="upload-text">
            <div class="upload-title">Sube un video</div>
            <div class="upload-hint">MP4, WEBM, MKV (máx. 100MB)</div>
          </div>
          <input type="file" id="videoInput" accept="video/*" style="display:none;">
        </label>
        <div class="upload-field-group">
          <input type="text" id="videoTitle" placeholder="Título del video" class="upload-field">
          <input type="text" id="videoDescription" placeholder="Descripción" class="upload-field">
          <button type="button" class="upload-btn" id="addVideoBtn">Agregar video</button>
        </div>
      </div>
    </section>

    <!-- Library Panel -->
    <section class="panel library-panel">
      <div class="rivet tl"></div><div class="rivet tr"></div><div class="rivet bl"></div><div class="rivet br"></div>

      <div class="library-filters">
        <button class="filter-btn active" data-filter="all">Todo</button>
        <button class="filter-btn" data-filter="music">Música</button>
        <button class="filter-btn" data-filter="image">Imágenes</button>
        <button class="filter-btn" data-filter="video">Videos</button>
      </div>

      <div id="libraryGrid" class="library-grid">
        <!-- Los elementos se cargan aquí -->
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📚</div>
        <div class="empty-title">Tu biblioteca está vacía</div>
        <div class="empty-sub">Comienza subiendo música, imágenes o videos</div>
      </div>
    </section>
  </main>
